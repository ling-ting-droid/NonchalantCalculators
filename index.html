<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartridge Pull Game</title>
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      background: #1b1b1b;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .gameboy {
      width: 300px;
      height: 400px;
      background: #444;
      border: 8px solid #888;
      border-radius: 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px #000;
    }

    .screen {
      width: 220px;
      height: 180px;
      background: #111;
      border: 4px inset #555;
      border-radius: 8px;
    }

    .library {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cartridge {
      width: 60px;
      height: 80px;
      background: #666;
      border: 2px solid #aaa;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .cartridge:hover {
      transform: scale(1.1);
    }

    .cartridge img {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>
<body>
  <div class="gameboy">
    <div class="screen"></div>
  </div>

  <div class="library">
    <div class="cartridge" data-url="https://example.com/game1">
      <img src="https://via.placeholder.com/50x70" alt="Game 1">
    </div>
    <div class="cartridge" data-url="https://example.com/game2">
      <img src="https://via.placeholder.com/50x70" alt="Game 2">
    </div>
    <!-- Add more cartridges as needed -->
  </div>

  <script>
    document.querySelectorAll('.cartridge').forEach(cart => {
      cart.ondblclick = () => {
        const gameUrl = cart.dataset.url
        if (gameUrl) {
          window.open(gameUrl, '_blank')
        }
      }
    })
  </script>
</body>
</html>
