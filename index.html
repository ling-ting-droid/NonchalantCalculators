<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>crazycals</title>
  <style>
    .moving-banner {
  position: fixed;
  top: 30px;
  left: -100%;
  transform: rotate(-10deg);
  background: red;
  color: white;
  padding: 10px 50px;
  font-weight: bold;
  font-size: 1.2em;
  animation: slide-banner 10s linear infinite;
  z-index: 9999;
}

@keyframes slide-banner {
  0% {
    left: -100%;
  }
  100% {
    left: 110%;
  }
}

    body {
      margin: 0; font-family: sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: #111;
    }

    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 20px 40px; z-index: 10;
      backdrop-filter: blur(8px);
    }

    .menu-btn {
      cursor: pointer; font-size: 30px;
      transition: transform 0.3s ease;
    }

    .menu-btn:hover { transform: scale(1.1); }

    .overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .overlay.active {
      opacity: 1; pointer-events: auto;
    }

    .overlay a {
      font-size: 2rem;
      color: #fff; text-decoration: none;
      transform: translateY(20px);
      opacity: 0; transition: 0.3s ease;
    }

    .overlay.active a {
      transform: translateY(0);
      opacity: 1;
    }

    .overlay a:nth-child(1) { transition-delay: 0.1s; }
    .overlay a:nth-child(2) { transition-delay: 0.2s; }
    .overlay a:nth-child(3) { transition-delay: 0.3s; }
    .overlay a:nth-child(4) { transition-delay: 0.4s; }

    .bulge-icon {
  width: 64px;
  animation: bulge 1s infinite ease-in-out;
}

@keyframes bulge {
  0%, 100% {
    transform: scale(1) rotate(0deg);
  }
  50% {
    transform: scale(1.2) rotate(5deg);
  }
}
  </style>
</head>
<body>
  
<div class="moving-banner">🔥 GET VPN NOW FREE 🔥</div>
  
  <img src="https://pacifichifi.s3.ap-southeast-2.amazonaws.com/wp-content/uploads/2021/07/10044419/JBL-Charge-3-Full-featured-Waterproof-Portable-Speaker-Teal-Angle-1.jpg" class="bulge-icon">

  <div class="navbar">
    <h2>🌐 crazy calculators</h2>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
  </div>

  <div class="overlay" id="navOverlay">
    <a href="games.html">games</a>
   
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("navOverlay").classList.toggle("active")
    }
  </script>

</body>
</html>
