
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>crazycals</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    background: #0b0b0c;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  /* NAVBAR */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    z-index: 10000;
    backdrop-filter: blur(8px);
  }

  .navbar h2 {
    font-size: 20px;
    font-weight: 500;
    margin: 0;
  }

  .menu-btn {
    cursor: pointer;
    font-size: 30px;
    line-height: 1;
    background: none;
    border: none;
    color: white;
    transition: transform 0.3s ease;
  }

  .menu-btn:hover {
    transform: scale(1.1);
  }

  /* FULLSCREEN MENU */
  .overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 9998;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay a {
    font-size: 2rem;
    color: #fff;
    text-decoration: none;
    transform: translateY(20px);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .overlay a:hover {
    opacity: 0.6;
  }

  .overlay.active a {
    transform: translateY(0);
    opacity: 1;
  }

  .overlay a:nth-child(1) { transition-delay: 0.1s; }
  .overlay a:nth-child(2) { transition-delay: 0.2s; }
  .overlay a:nth-child(3) { transition-delay: 0.3s; }

  /* ALBUM CAROUSEL */
  .stage-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 420px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  .card {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 16px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: none;
    background: transparent;
    padding: 0;
    transition:
      transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
      z-index 0.6s,
      opacity 0.6s,
      filter 0.4s ease;
    backface-visibility: hidden;
  }

  .card:focus-visible {
    outline: 4px solid #667eea;
    outline-offset: 8px;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .card.zoom-out {
    transform: translateX(0px) translateZ(600px) rotateY(0deg) !important;
    opacity: 0 !important;
    filter: brightness(2);
    z-index: 9999 !important;
  }

  .album-title {
    margin-top: 25px;
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    height: 40px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform: translateY(0);
    opacity: 1;
  }

  .album-title.changing {
    opacity: 0;
    transform: translateY(10px);
  }

  /* SMALLER SCREENS */
  @media (max-width: 600px) {
    .navbar {
      padding: 20px;
    }

    .navbar h2 {
      font-size: 17px;
    }

    .stage {
      height: 340px;
    }

    .card {
      width: min(250px, 65vw);
      height: min(250px, 65vw);
    }

    .album-title {
      font-size: 1.4rem;
    }

    .overlay a {
      font-size: 1.7rem;
    }
  }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2>🌐 crazy calculators</h2>
  <button class="menu-btn"
          id="menuButton"
          onclick="toggleMenu()"
          aria-label="Open menu"
          aria-expanded="false">☰</button>
</div>

<!-- NAVIGATION OVERLAY -->
<nav class="overlay" id="navOverlay" aria-label="Main navigation">
  <a href="games.html">web games</a>
  <a href="bettergames.html">better games</a>
  <a href="gust.html">oo what's this</a>
</nav>

<!-- MAIN VISUAL: 3D ALBUM CAROUSEL -->
<div class="stage-container">
  <div class="stage">

    <button class="card" data-index="0"
      data-title="Discovery" data-link="page1.html"
      aria-label="Discovery album">
      <img src="https://picsum.photos/seed/discovery/500/500"
        alt="Discovery cover">
    </button>

    <button class="card" data-index="1"
      data-title="Random Access Memories" data-link="page2.html"
      aria-label="Random Access Memories album">
      <img src="https://picsum.photos/seed/memories/500/500"
        alt="Random Access Memories cover">
    </button>

    <button class="card" data-index="2"
      data-title="Graduation" data-link="page3.html"
      aria-label="Graduation album">
      <img src="images/download.jpg" alt="Graduation cover">
    </button>

    <button class="card" data-index="3"
      data-title="Abbey Road" data-link="page4.html"
      aria-label="Abbey Road album">
      <img src="https://picsum.photos/seed/abbeyroad/500/500"
        alt="Abbey Road cover">
    </button>

  </div>

  <div class="album-title" id="current-title"></div>
</div>

<script>
  /* MENU */
  function toggleMenu() {
    const overlay = document.getElementById("navOverlay");
    const button = document.getElementById("menuButton");
    const isOpen = overlay.classList.toggle("active");

    button.textContent = isOpen ? "×" : "☰";
    button.setAttribute("aria-expanded", isOpen);
    button.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
  }

  /* ALBUM CAROUSEL */
  const cards = [...document.querySelectorAll(".card")];
  const totalCards = cards.length;
  const titleDisplay = document.getElementById("current-title");
  let activeIndex = 1;
  let navigating = false;

  function updateLayout() {
    let activeTitle = "";

    titleDisplay.classList.add("changing");

    cards.forEach((card) => {
      if (card.classList.contains("zoom-out")) return;

      const cardIndex = Number(card.dataset.index);
      const offset = cardIndex - activeIndex;

      if (offset === 0) {
        card.style.transform =
          "translateX(0px) translateZ(150px) rotateY(0deg)";
        card.style.zIndex = 100;
        card.style.opacity = "1";
        activeTitle = card.dataset.title;
      } else if (offset < 0) {
        const xPos = -600 + offset * 50;
        card.style.transform =
          `translateX(${xPos}px) translateZ(-150px) rotateY(55deg)`;
        card.style.zIndex = 100 + offset;
        card.style.opacity = Math.max(0.1, 1 + offset * 0.2);
      } else {
        const xPos = 600 + offset * 50;
        card.style.transform =
          `translateX(${xPos}px) translateZ(-150px) rotateY(-55deg)`;
        card.style.zIndex = 100 - offset;
        card.style.opacity = Math.max(0.1, 1 - offset * 0.2);
      }
    });

    setTimeout(() => {
      titleDisplay.textContent = activeTitle || "Untitled Album";
      titleDisplay.classList.remove("changing");
    }, 200);
  }

  function handleCardAction(clickedCard) {
    if (navigating) return;

    const index = Number(clickedCard.dataset.index);

    if (activeIndex !== index) {
      activeIndex = index;
      updateLayout();
      return;
    }

    const destinationLink = clickedCard.dataset.link;

    if (destinationLink) {
      navigating = true;
      clickedCard.classList.add("zoom-out");

      titleDisplay.style.opacity = "0";
      titleDisplay.style.transform = "translateY(15px)";

      setTimeout(() => {
        window.location.href = destinationLink;
      }, 500);
    }
  }

  cards.forEach((card) => {
    card.addEventListener("click", () => handleCardAction(card));
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      const overlay = document.getElementById("navOverlay");
      if (overlay.classList.contains("active")) toggleMenu();
    }

    if (document.getElementById("navOverlay").classList.contains("active")) {
      return;
    }

    if (e.key === "ArrowLeft" && activeIndex > 0) {
      activeIndex--;
      updateLayout();
    } else if (e.key === "ArrowRight" && activeIndex < totalCards - 1) {
      activeIndex++;
      updateLayout();
    } else if (e.key === "Enter") {
      const activeElement = document.activeElement;
      if (activeElement && activeElement.classList.contains("card")) {
        activeElement.click();
      }
    }
  });

  updateLayout();
</script>

</body>
</html>
