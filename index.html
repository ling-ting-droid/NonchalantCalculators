<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOL's RNG Game Pull</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      position: relative;
      overflow-x: hidden;
    }
    .button {
      background: #ff0077;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }
    .button:hover {
      transform: scale(1.05);
    }
    .cooldown-bar {
      width: 180px;
      height: 10px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .cooldown-fill {
      height: 100%;
      background: #00ff9f;
      width: 0;
      transition: width 1s linear;
    }
    .trash-talk {
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
      text-align: center;
      font-style: italic;
      margin-bottom: 20px;
      max-width: 400px;
    }
    .library, .result {
      margin-top: 20px;
      max-width: 600px;
      width: 100%;
    }
    .result {
      margin-bottom: 30px;
    }
    .cartridge-entry {
      width: 120px;
      height: 60px;
      background: #333;
      border: 2px solid #fff;
      border-radius: 6px;
      color: white;
      text-align: center;
      line-height: 60px;
      font-size: 14px;
      margin: 10px;
      cursor: grab;
      user-select: none;
      transition: transform 0.3s;
    }
    .cartridge-entry:active {
      cursor: grabbing;
    }
    .common { box-shadow: 0 0 5px #aaa; }
    .rare { box-shadow: 0 0 10px #00faff; }
    .epic { box-shadow: 0 0 12px #cc00ff; }
    .legendary { box-shadow: 0 0 15px #ffc700; }

    .gameboy {
      width: 220px;
      height: 320px;
      background: #222 url('https://i.imgur.com/sfcsMWR.png') no-repeat center/cover;
      border: 6px solid #999;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      margin-top: 20px;
      z-index: 0;
    }
    .screen {
      width: 180px;
      height: 100px;
      background: #111;
      border: 3px solid #fff;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: lime;
      font-family: monospace;
      overflow: hidden;
      position: relative;
    }
    .dropzone {
      width: 120px;
      height: 20px;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      border: 2px dashed transparent;
    }
    .dropzone:hover {
      border-color: #fff;
    }
    #fullscreenGame {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: black;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transform: translate(-50%, -50%) scale(0);
      transition: all 0.5s ease-in-out;
      overflow: hidden;
    }
    #fullscreenGame.show {
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%) scale(1);
      border-radius: 0;
    }
    #fullscreenGame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>🎲 SOL's RNG Game Generator 🎮</h1>
  <button class="button" onclick="rollGame()">Pull a Game</button>
  <div class="cooldown-bar"><div id="cooldownFill" class="cooldown-fill"></div></div>
  <div class="trash-talk" id="trashTalk">let’s see how mid u really are...</div>
  <div class="result"></div>

  <div class="gameboy" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
    <div class="screen"><span id="screenText"></span></div>
    <div class="dropzone"></div>
  </div>

  <div class="library">
    <h2>Your Library 📚</h2>
    <div id="library-list" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
  </div>

  <div id="fullscreenGame"><iframe id="fullscreenFrame"></iframe></div>

  <script>
    const games = [
      { name: "Slope", rarity: "common", link: "slope.html" },
      { name: "Flappy Bird", rarity: "common", link: "flappy.html" },
      { name: "Moto X3M", rarity: "rare", link: "moto/index.html" },
      { name: "1v1.lol", rarity: "rare", link: "1v1.html" },
      { name: "Subway Surfers", rarity: "epic", link: "subway/game.html" },
      { name: "Basket Bros", rarity: "epic", link: "basket.html" },
      { name: "GTA Web", rarity: "legendary", link: "gta/index.html" },
      { name: "Bloons TD", rarity: "legendary", link: "bloons/index.html" }
    ];

    const rarities = {
      common: 60,
      rare: 25,
      epic: 10,
      legendary: 5
    };

    const trashLines = [
      "bro pulled mid again 💀",
      "yawn... try again",
      "that’s the best u got?",
      "lmaoo ur rng cooked",
      "ur luck stat is in the negatives 😭"
    ];

    let library = JSON.parse(localStorage.getItem("sol_library")) || [];
    let cooldown = false;
    let lastGame = null;

    function rollGame() {
      if (cooldown) return;
      cooldown = true;
      startCooldown();

      const roll = Math.random() * 100;
      let pickedRarity = "common";
      if (roll <= rarities.legendary) pickedRarity = "legendary";
      else if (roll <= rarities.legendary + rarities.epic) pickedRarity = "epic";
      else if (roll <= rarities.legendary + rarities.epic + rarities.rare) pickedRarity = "rare";

      const filtered = games.filter(g => g.rarity === pickedRarity);
      const selected = filtered[Math.floor(Math.random() * filtered.length)];

      lastGame = selected;

      if (!library.find(g => g.name === selected.name)) {
        library.push(selected);
        localStorage.setItem("sol_library", JSON.stringify(library));
        updateLibrary();
      }

      document.querySelector(".result").innerHTML = `
        <div class="result-animation ${selected.rarity}">
          ⭐ You pulled a <span class="${selected.rarity}">${selected.rarity.toUpperCase()}</span>:
          <span class="cartridge-entry ${selected.rarity}">${selected.name}</span>
        </div>`;

      const trash = trashLines[Math.floor(Math.random() * trashLines.length)];
      const trashDiv = document.getElementById("trashTalk");
      trashDiv.textContent = trash;
      trashDiv.style.opacity = 0;
      setTimeout(() => trashDiv.style.opacity = 1, 100);
    }

    function updateLibrary() {
      const list = document.getElementById("library-list");
      list.innerHTML = "";
      library.forEach((g, i) => {
        const div = document.createElement('div');
        div.className = `cartridge-entry ${g.rarity}`;
        div.textContent = g.name;
        div.setAttribute('draggable', true);
        div.dataset.link = g.link;
        div.ondragstart = (e) => {
          e.dataTransfer.setData("text/plain", g.link);
        };
        list.appendChild(div);
      });
    }

    function handleDrop(e) {
      e.preventDefault();
      const link = e.dataTransfer.getData("text/plain");
      openFullscreen(link);
    }

    function openFullscreen(link) {
      const full = document.getElementById("fullscreenGame");
      const frame = document.getElementById("fullscreenFrame");
      frame.src = link;
      full.classList.add("show");
      full.style.display = "flex";
    }

    function closeFullscreen() {
      const full = document.getElementById("fullscreenGame");
      const frame = document.getElementById("fullscreenFrame");
      full.classList.remove("show");
      setTimeout(() => {
        frame.src = "";
        full.style.display = "none";
      }, 500);
    }

    function startCooldown() {
      const fill = document.getElementById("cooldownFill");
      fill.style.width = "100%";
      let percent = 100;
      const interval = setInterval(() => {
        percent -= 1;
        fill.style.width = percent + "%";
        if (percent <= 0) {
          clearInterval(interval);
          cooldown = false;
        }
      }, 30);
    }

    updateLibrary();
  </script>
</body>
</html>
