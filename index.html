<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOL's RNG Game Pull</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    .button, .gamble-btn {
      background: #ff0077;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 50px;
      transition: transform 0.2s;
    }

    .button:disabled, .gamble-btn:disabled {
      background: #88003f;
      cursor: not-allowed;
    }

    .button:hover:enabled, .gamble-btn:hover:enabled {
      transform: scale(1.05);
    }

    .cooldown-bar {
      width: 100%;
      max-width: 150px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .cooldown-fill {
      height: 100%;
      width: 0%;
      background: #ff0077;
      transition: width 0.1s linear;
    }

    .trash-talk {
      font-style: italic;
      font-size: 14px;
      margin-bottom: 20px;
      color: #ffb3d9;
      animation: fadeIn 0.6s ease forwards;
      min-height: 18px;
    }

    .result-card {
      position: relative;
      width: 240px;
      height: 320px;
      background: #222;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      animation: revealCard 1s ease;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      overflow: hidden;
    }

    .card-shimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%) translateY(-100%);
      animation: shimmer 1s ease forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%) translateY(-100%);
      }
      100% {
        transform: translateX(100%) translateY(100%);
      }
    }

    @keyframes revealCard {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .game-shelf {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      max-width: 800px;
    }

    .shelf-row {
      display: flex;
      justify-content: start;
      gap: 12px;
      padding: 12px;
      background: #2c1f15;
      border-bottom: 5px solid #1a110b;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .shelf-card {
      position: relative;
      background: #222;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 10px;
      min-width: 90px;
      text-align: center;
      cursor: pointer;
      animation: fadeIn 0.4s ease forwards;
      transition: transform 0.2s ease;
      overflow: hidden;
    }

    .shelf-card.selected {
      border-color: #ff0077;
      box-shadow: 0 0 10px #ff0077;
    }

    .shelf-card:hover {
      transform: scale(1.05);
    }

    .common { color: #aaa; }
    .rare { color: #00faff; }
    .epic { color: #cc00ff; }
    .legendary { color: #ffc700; font-weight: bold; }

    .blur-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: none;
    }

    .game-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 80%;
      background: #000;
      border: 3px solid #fff;
      z-index: 1001;
      display: none;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      animation: popupAppear 0.4s ease forwards;
    }

    .game-popup iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    .close-btn {
      background: #ff0077;
      border: none;
      color: white;
      font-size: 16px;
      padding: 8px 12px;
      cursor: pointer;
      align-self: flex-end;
    }
  </style>
</head>
<body>
  <!-- rest of the HTML stays unchanged -->
</body>
</html>
