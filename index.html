<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>crazycals</title>
  <style>
    /* =========================================
       1. CUSTOMISATION SETTINGS (EDIT THESE!)
       ========================================= */
    :root {
      --globe-size: 250px;        /* Size of the globe */
      --min-orbit-radius: 260px;  /* Minimum ring radius (auto-expands with big text) */
      --vertical-offset: -40px;   /* Negative = moves ring HIGHER, Positive = LOWER */
      --tilt-angle: 72deg;        /* Tilt of the ring */
      --spin-speed: 20s;          /* Seconds per full orbit (lower = faster) */
      --text-color: #ffffff;      /* Text colour */
      --font-size: 38px;          /* Bigger font size! */
      --letter-spacing: 1.05;     /* Gap multiplier between letters */
      --globe-color-1: #00f2fe;   /* Bright cyan highlight */
      --globe-color-2: #005bea;   /* Deep blue shadow */
    }

    /* =========================================
       2. YOUR EXISTING PAGE & NAVBAR STYLES
       ========================================= */
    body {
      margin: 0; 
      font-family: monospace, sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 40px; 
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .navbar h2 { margin: 0; }

    .menu-btn {
      cursor: pointer; font-size: 30px;
      transition: transform 0.3s ease;
    }

    .menu-btn:hover { transform: scale(1.1); }

    .overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 30;
    }

    .overlay.active { opacity: 1; pointer-events: auto; }

    .overlay a {
      font-size: 2rem;
      color: #fff; text-decoration: none;
      transform: translateY(20px);
      opacity: 0; transition: 0.3s ease;
    }

    .overlay.active a { transform: translateY(0); opacity: 1; }
    .overlay a:nth-child(1) { transition-delay: 0.1s; }
    .overlay a:nth-child(2) { transition-delay: 0.2s; }

    /* =========================================
       3. HERO SECTION & 3D GLOBE STYLES
       ========================================= */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .scene {
      position: relative;
      width: var(--globe-size);
      height: var(--globe-size);
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
    }

    .globe {
      position: absolute;
      width: var(--globe-size);
      height: var(--globe-size);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--globe-color-1), var(--globe-color-2), #020b26);
      box-shadow: inset -20px -20px 40px rgba(0, 0, 0, 0.8),
                  0 0 50px rgba(0, 242, 254, 0.25);
      transform: translateZ(0px);
    }

    .orbit-tilt {
      position: absolute;
      transform-style: preserve-3d;
      /* translateY moves the whole ring up or down before tilting it */
      transform: translateY(var(--vertical-offset)) rotateX(var(--tilt-angle)) rotateY(-12deg);
    }

    .text-ring {
      position: relative;
      transform-style: preserve-3d;
      animation: orbit var(--spin-speed) linear infinite;
    }

    .text-ring span {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: var(--font-size);
      font-weight: 900;
      color: var(--text-color);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.7);
      backface-visibility: hidden; 
    }

    @keyframes orbit {
      from { transform: rotateZ(0deg); }
      to   { transform: rotateZ(360deg); }
    }
  </style>
</head>
<body>
  
  <div class="navbar">
    <h2>🌐 crazy calculators</h2>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
  </div>

  <div class="overlay" id="navOverlay">
    <a href="games.html">games</a>
    <a href="gust.html">not games</a>
  </div>

  <main class="hero">
    <div class="scene">
      <div class="globe"></div>
      <div class="orbit-tilt">
        <div class="text-ring" id="orbit-text" data-text="yall's games be eating my bandwidth like umm, uhhh • "></div>
      </div>
    </div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById("navOverlay").classList.toggle("active");
    }

    const ring = document.getElementById('orbit-text');
    const text = ring.getAttribute('data-text');
    const letters = text.split('');
    const styles = getComputedStyle(document.documentElement);

    const minRadius = parseFloat(styles.getPropertyValue('--min-orbit-radius'));
    const fontSize = parseFloat(styles.getPropertyValue('--font-size'));
    const spacing = parseFloat(styles.getPropertyValue('--letter-spacing'));

    const charWidth = fontSize * 0.65 * spacing;
    const neededRadius = (letters.length * charWidth) / (2 * Math.PI);
    const finalRadius = Math.max(minRadius, neededRadius);

    const angleStep = 360 / letters.length;

    letters.forEach((letter, index) => {
      const span = document.createElement('span');
      span.innerHTML = letter === ' ' ? '&nbsp;' : letter;

      const angle = -index * angleStep;

      span.style.transform = `
        translate(-50%, -50%) 
        rotateZ(${angle}deg) 
        translateY(${finalRadius}px) 
        rotateX(-90deg)
      `;

      ring.appendChild(span);
    });
  </script>

</body>
</html>
