<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOL's RNG Game Pull</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      position: relative;
    }
    .button {
      background: #ff0077;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }
    .button:hover {
      transform: scale(1.05);
    }
    .cooldown-bar {
      width: 180px;
      height: 10px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .cooldown-fill {
      height: 100%;
      background: #00ff9f;
      width: 0;
      transition: width 1s linear;
    }
    .trash-talk {
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
      text-align: center;
      font-style: italic;
      margin-bottom: 20px;
      max-width: 400px;
    }
    .library, .result {
      margin-top: 20px;
      max-width: 600px;
      width: 100%;
    }
    .result {
      margin-bottom: 30px;
    }
    .game-entry {
      background: #222;
      padding: 10px 15px;
      border-radius: 6px;
      margin: 8px 0;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
      cursor: pointer;
    }
    .common { color: #aaa; }
    .rare { color: #00faff; }
    .epic { color: #cc00ff; }
    .legendary { color: #ffc700; font-weight: bold; }

    .result-animation {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
      animation: popFade 0.6s ease;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes popFade {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes popupAppear {
      0% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .blur-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: none;
    }

    .game-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 80%;
      background: #000;
      border: 3px solid #fff;
      z-index: 1001;
      display: none;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      animation: popupAppear 0.4s ease forwards;
    }
    .game-popup iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }
    .close-btn {
      background: #ff0077;
      border: none;
      color: white;
      font-size: 16px;
      padding: 8px 12px;
      cursor: pointer;
      align-self: flex-end;
    }
    .gameboy {
      width: 200px;
      height: 300px;
      background: #333;
      border: 6px solid #999;
      border-radius: 15px;
      padding: 20px;
      position: relative;
      margin-top: 20px;
    }
    .screen {
      width: 160px;
      height: 100px;
      background: #111;
      border: 3px solid #fff;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot {
      width: 80px;
      height: 10px;
      background: #000;
      margin: 0 auto;
      border-radius: 2px;
    }
    .cartridge {
      width: 80px;
      height: 40px;
      background: #666;
      border: 2px solid #fff;
      border-radius: 5px;
      text-align: center;
      line-height: 40px;
      color: white;
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      animation: dropIn 0.7s forwards;
    }
    @keyframes dropIn {
      0% { top: -50px; }
      100% { top: 150px; }
    }
  </style>
</head>
<body>
  <h1>🎲 SOL's RNG Game Generator 🎮</h1>
  <button class="button" onclick="rollGame()">Pull a Game</button>
  <div class="cooldown-bar"><div id="cooldownFill" class="cooldown-fill"></div></div>
  <div class="trash-talk" id="trashTalk">let’s see how mid u really are...</div>
  <div class="result"></div>
  <div class="gameboy">
    <div class="screen">
      <div id="screenText">🔲</div>
    </div>
    <div class="slot"></div>
  </div>
  <div class="library">
    <h2>Your Library 📚</h2>
    <div id="library-list"></div>
  </div>
  <div class="blur-bg" id="blurBg"></div>
  <div class="game-popup" id="gamePopup">
    <button class="close-btn" onclick="closePopup()">✖ Close</button>
    <iframe id="popupFrame"></iframe>
  </div>

  <script>
    const games = [
      { name: "Slope", rarity: "common", link: "slope.html" },
      { name: "Flappy Bird", rarity: "common", link: "flappy.html" },
      { name: "Moto X3M", rarity: "rare", link: "moto/index.html" },
      { name: "1v1.lol", rarity: "rare", link: "1v1.html" },
      { name: "Subway Surfers", rarity: "epic", link: "subway/game.html" },
      { name: "Basket Bros", rarity: "epic", link: "basket.html" },
      { name: "GTA Web", rarity: "legendary", link: "gta/index.html" },
      { name: "Bloons TD", rarity: "legendary", link: "bloons/index.html" }
    ];

    const rarities = {
      common: 60,
      rare: 25,
      epic: 10,
      legendary: 5
    };

    const trashLines = [
      "bro pulled mid again 💀",
      "yawn... try again",
      "that’s the best u got?",
      "lmaoo ur rng cooked",
      "ur luck stat is in the negatives 😭"
    ];

    const library = [];
    let cooldown = false;

    function rollGame() {
      if (cooldown) return;
      cooldown = true;
      startCooldown();

      const roll = Math.random() * 100;
      let pickedRarity = "common";
      if (roll <= rarities.legendary) pickedRarity = "legendary";
      else if (roll <= rarities.legendary + rarities.epic) pickedRarity = "epic";
      else if (roll <= rarities.legendary + rarities.epic + rarities.rare) pickedRarity = "rare";

      const filtered = games.filter(g => g.rarity === pickedRarity);
      const selected = filtered[Math.floor(Math.random() * filtered.length)];

      if (!library.find(g => g.name === selected.name)) {
        library.push(selected);
        updateLibrary();
      }

      animateCartridgePull(selected);

      document.querySelector(".result").innerHTML = `
        <div class="result-animation ${selected.rarity}">
          ⭐ You pulled a <span class="${selected.rarity}">${selected.rarity.toUpperCase()}</span>:
          <span class="game-entry ${selected.rarity}" onclick="openPopup('${selected.link}')">${selected.name}</span>
        </div>`;

      const trash = trashLines[Math.floor(Math.random() * trashLines.length)];
      const trashDiv = document.getElementById("trashTalk");
      trashDiv.textContent = trash;
      trashDiv.style.opacity = 0;
      setTimeout(() => trashDiv.style.opacity = 1, 100);
    }

    function animateCartridgePull(game) {
      const gameboy = document.querySelector('.gameboy');
      const cart = document.createElement('div');
      cart.className = 'cartridge ' + game.rarity;
      cart.textContent = game.name;
      gameboy.appendChild(cart);

      const screen = document.getElementById('screenText');
      screen.textContent = game.rarity.toUpperCase() + ' PULL';

      setTimeout(() => {
        cart.remove();
        screen.textContent = '🔲';
      }, 2500);
    }

    function updateLibrary() {
      const list = document.getElementById("library-list");
      list.innerHTML = "";
      library.forEach(g => {
        const div = document.createElement('div');
        div.className = `game-entry ${g.rarity}`;
        div.textContent = `${g.name} [${g.rarity.toUpperCase()}]`;
        div.dataset.link = g.link;

        let clickTimeout = null;
        div.onclick = () => {
          if (clickTimeout !== null) {
            clearTimeout(clickTimeout);
            clickTimeout = null;
            openPopup(div.dataset.link);
          } else {
            clickTimeout = setTimeout(() => {
              div.classList.toggle("selected");
              clickTimeout = null;
            }, 250);
          }
        };

        list.appendChild(div);
      });
    }

    function openPopup(link) {
      const popup = document.getElementById("gamePopup");
      const frame = document.getElementById("popupFrame");
      const blur = document.getElementById("blurBg");
      frame.src = link;
      popup.style.display = "flex";
      blur.style.display = "block";
    }

    function closePopup() {
      const popup = document.getElementById("gamePopup");
      const frame = document.getElementById("popupFrame");
      const blur = document.getElementById("blurBg");
      frame.src = "";
      popup.style.display = "none";
      blur.style.display = "none";
    }

    function startCooldown() {
      const fill = document.getElementById("cooldownFill");
      fill.style.width = "100%";
      let percent = 100;
      const interval = setInterval(() => {
        percent -= 1;
        fill.style.width = percent + "%";
        if (percent <= 0) {
          clearInterval(interval);
          cooldown = false;
        }
      }, 30);
    }
  </script>
</body>
</html>
