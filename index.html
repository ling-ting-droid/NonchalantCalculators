<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>crazycals</title>
  <style>

    /* BULGE ICON */
.bulge-wrapper {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9998;
}

.bulge-icon {
  width: 80px;
  animation: bulge 1s infinite ease-in-out;
  cursor: pointer;
}

@keyframes bulge {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
}

/* MOVING BANNERS */
.moving-banner {
  position: fixed;
  width: 100%;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 5px #000;
  background: red;
  padding: 5px 0;
  transform: rotate(-2deg);
  animation: slideBanner 10s linear infinite;
  z-index: 9999;
}

.banner1 {
  top: 0.5;
}

.banner2 {
  top: 40px;
  animation-delay: 5s;
}

@keyframes slideBanner {
  0% {
    left: -100%;
  }
  100% {
    left: 100%;
  }
}

/* OPTIONAL: NAVBAR + OVERLAY FIXES */
.navbar {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.2);
  z-index: 9997;
  position: fixed;
  width: 100%;
}

.overlay {
  z-index: 9996;
}


    body {
      margin: 0; font-family: sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: #111;
    }

    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 20px 40px; z-index: 10;
      backdrop-filter: blur(8px);
    }

    .menu-btn {
      cursor: pointer; font-size: 30px;
      transition: transform 0.3s ease;
    }

    .menu-btn:hover { transform: scale(1.1); }

    .overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .overlay.active {
      opacity: 1; pointer-events: auto;
    }

    .overlay a {
      font-size: 2rem;
      color: #fff; text-decoration: none;
      transform: translateY(20px);
      opacity: 0; transition: 0.3s ease;
    }

    .overlay.active a {
      transform: translateY(0);
      opacity: 1;
    }

    .overlay a:nth-child(1) { transition-delay: 0.1s; }
    .overlay a:nth-child(2) { transition-delay: 0.2s; }
    .overlay a:nth-child(3) { transition-delay: 0.3s; }
    .overlay a:nth-child(4) { transition-delay: 0.4s; }

  </style>
</head>
<body>
  
<!-- BULGING ICON -->
<div class="bulge-wrapper">
  <img src="https://pacifichifi.s3.ap-southeast-2.amazonaws.com/wp-content/uploads/2021/07/10044419/JBL-Charge-3-Full-featured-Waterproof-Portable-Speaker-Teal-Angle-1.jpg" class="bulge-icon">
</div>

<!-- MOVING BANNERS -->
<div class="moving-banner banner1">🔥 HOT DEALS 🔥</div>
<div class="moving-banner banner2">💀 LIMITED TIME OFFER 💀</div>

  <div class="navbar">
    <h2>🌐 crazy calculators</h2>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
  </div>

  <div class="overlay" id="navOverlay">
    <a href="games.html">games</a>
   
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("navOverlay").classList.toggle("active")
    }
  </script>

</body>
</html>
