<div style="width:640px;height:480px;max-width:100%">
    <div id="game"></div>
</div>

<script>
    window.EJS_player = '#game';
    window.EJS_core = 'psx';
    window.EJS_language = 'en-US';

    window.EJS_biosUrl =
        'https://archive.org/download/resident-evil-directors-cut_202610/SCPH1001.BIN';

    window.EJS_gameUrl =
        'https://archive.org/download/resident-evil-directors-cut_20261028/Resident%20Evil%20-%20Director%27s%20Cut.chd';

    window.EJS_pathtodata =
        'https://cdn.emulatorjs.org/stable/data/';

    // Log emulator errors in the browser console
    window.addEventListener('error', function (event) {
        console.error('Emulator page error:', event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
        console.error('Emulator loading error:', event.reason);
    });
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
