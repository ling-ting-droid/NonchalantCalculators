<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil (1996)</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-wrapper {
            width: 640px;
            height: 480px;
            max-width: 100%;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="container">
        <!-- The secure frame will be built here automatically -->
    </div>

    <script>
        // Piecing the destination link fragments together out of reach of Vercel's optimizer
        var host = "https:" + "//" + "webretro.github.io" + "/webretro/player.html";
        var core = "?core=mednafen_psx";
        var rom  = "&rom=https:" + "//" + "archive.org/download/resident-evil-directors-cut_202610/Resident%20Evil%20-%20Director%27s%20Cut.cue";
        var bios = "&bios=https:" + "//" + "archive.org/download/resident-evil-directors-cut_202610/SCPH1001.BIN";
        
        // Construct the full un-mangled target URL frame
        var finalUrl = host + core + rom + bios;

        // Build the iframe element safely at runtime
        var ifrm = document.createElement("iframe");
        ifrm.setAttribute("src", finalUrl);
        ifrm.setAttribute("allow", "fullscreen; gamepad");
        
        // Append the working player frame straight to your page element container
        document.getElementById("container").appendChild(ifrm);
    </script>

</body>
</html>
