<!-- The visual container for the game -->
<div style="width: 640px; height: 480px; max-width: 100%; margin: 0 auto; background: #000; position: relative;">
    <div id="game" style="width: 100%; height: 100%;"></div>
</div>

<script>
    // Emulator Settings
    EJS_player = '#game';
    EJS_core = 'psx';
    EJS_gameName = 'Resident Evil (1996)';
    EJS_color = '#ff0000'; 
    EJS_startOnLoaded = false; 
    EJS_cors = true; 

    // Using a different stable global mirror path that won't squish
    EJS_pathtodata = "https:" + "//" + "emulatorjs.ga" + "/data/";
    
    // Direct Internet Archive streaming data assets
    EJS_gameUrl = [
        'https://archive.org', 
        'https://archive.org'
    ]; 
    
    EJS_biosUrl = 'https://archive.org'; 
</script>

<!-- Launches the engine with split strings so code bundlers can't break the slashes -->
<script>
    (function() {
        var script = document.createElement('script');
        script.src = "https:" + "//" + "emulatorjs.ga" + "/data/loader.js";
        document.head.appendChild(script);
    })();
</script>
