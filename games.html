    }

    .game-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card p {
      margin: 0;
